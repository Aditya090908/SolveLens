<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">SolveLens — See Problems. Get Answers.</title>
  <desc id="desc">A modern mathematics and AI themed banner with gradient geometry, equations, and the SolveLens wordmark.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101329"/><stop offset=".55" stop-color="#17183b"/><stop offset="1" stop-color="#24143d"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8B5CF6"/><stop offset=".52" stop-color="#4F8CFF"/><stop offset="1" stop-color="#EC65B9"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#8B5CF6" stop-opacity=".38"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#B8B8FF" stroke-opacity=".08" stroke-width="1"/></pattern>
  </defs>
  <rect width="1600" height="520" rx="32" fill="url(#bg)"/>
  <rect width="1600" height="520" rx="32" fill="url(#grid)"/>
  <circle cx="1260" cy="250" r="340" fill="url(#glow)"/>
  <g opacity=".22" fill="none" stroke="url(#accent)" stroke-width="2">
    <circle cx="1275" cy="255" r="170"/><circle cx="1275" cy="255" r="118"/>
    <path d="M1085 255H1465M1275 65V445M1140 120L1410 390M1410 120L1140 390"/>
    <path d="M1170 340L1275 150L1380 340Z"/>
  </g>
  <g fill="#E9E8FF" opacity=".68" font-family="Georgia,serif" font-style="italic">
    <text x="1110" y="155" font-size="38">∑</text><text x="1420" y="190" font-size="34">π</text>
    <text x="1160" y="390" font-size="30">√x</text><text x="1385" y="370" font-size="34">x²</text>
  </g>
  <g transform="translate(130 140)">
    <rect x="0" y="0" width="76" height="76" rx="22" fill="url(#accent)"/>
    <path d="M18 43L33 58L59 25" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="102" y="57" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="66" font-weight="750" letter-spacing="-2">SolveLens</text>
    <text x="4" y="145" fill="#C9C7F3" font-family="Inter,Arial,sans-serif" font-size="29" letter-spacing="5">SEE PROBLEMS. GET ANSWERS.</text>
    <rect x="4" y="194" width="460" height="5" rx="3" fill="url(#accent)"/>
    <text x="4" y="250" fill="#D7D8EF" font-family="Inter,Arial,sans-serif" font-size="23">An AI-powered mathematics companion</text>
  </g>
  <g transform="translate(1050 100)">
    <rect x="0" y="0" width="350" height="310" rx="26" fill="#FFFFFF" fill-opacity=".055" stroke="#C8C6FF" stroke-opacity=".22"/>
    <text x="34" y="55" fill="#BEBBFA" font-family="Inter,Arial,sans-serif" font-size="17" letter-spacing="3">SOLVE WITH CLARITY</text>
    <text x="38" y="125" fill="#FFFFFF" font-family="Georgia,serif" font-size="42">2x + 3 = 7</text>
    <path d="M38 151H310" stroke="#B7A8FF" stroke-opacity=".35"/>
    <text x="38" y="204" fill="#D8D5F5" font-family="Georgia,serif" font-size="27">2x = 4</text>
    <text x="38" y="250" fill="#D8D5F5" font-family="Georgia,serif" font-size="27">x = 2</text>
    <circle cx="302" cy="250" r="20" fill="url(#accent)"/>
    <path d="M292 250L300 258L313 241" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>